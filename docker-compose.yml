name: hkufoss-booking-frontend
services:
  room-booking-frontend:
    container_name: hkufoss-booking-frontend
    # image: hkufoss-booking-frontend:production
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5173:80"
    # restart: unless-stopped
    networks:
      - hkufoss
    volumes:
      - .:/app
    environment:
      - VITE_PROJECT_NAME=frankwashereprod
      - VITE_FOO=Bazinga

networks:
  hkufoss:
    name: hkufoss
    external: true
